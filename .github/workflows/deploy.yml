name: Deploy homelab-blog

on:
  push:
    tag:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to the tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }} 
          tags: tag:ci
          ping: ${{ secrets.SER7_TS_IP }}

      - name: Load SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SER7_SSH_KEY }}

      - name: Trigger deploy on ser7
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SER7_USER }}@${{ secrets.SER7_TS_IP }} \
            "cd /home/lonelyhorse/go_learn/homelab-blog && bash ./homelab_blog_push_deploy.sh '${{ github.ref_name }}'"

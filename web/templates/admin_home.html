<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台 · LonelyHorse</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  {{template "admin-nav" .}}

  <main class="container">
    <header class="admin-head">
      <div>
        <p class="admin-eyebrow">Console</p>
        <h1>后台</h1>
      </div>
      <div class="admin-head-side">
        <span class="admin-count">已登录</span>
      </div>
    </header>

    <section class="hub-section">
      <h2 class="hub-label">内容</h2>
      <ul class="hub-list">
        <li>
          <a class="hub-row" href="/admin/posts">
            <span class="hub-idx" aria-hidden="true">01</span>
            <span class="hub-text">
              <span class="hub-title">文章后台</span>
              <span class="hub-desc">新建、编辑、发布与删除文章</span>
            </span>
            <span class="hub-go" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a class="hub-row" href="/admin/projects">
            <span class="hub-idx" aria-hidden="true">02</span>
            <span class="hub-text">
              <span class="hub-title">项目后台</span>
              <span class="hub-desc">新增、编辑、排序、归档与删除项目</span>
            </span>
            <span class="hub-go" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a class="hub-row" href="/about/edit">
            <span class="hub-idx" aria-hidden="true">03</span>
            <span class="hub-text">
              <span class="hub-title">编辑个人简介</span>
              <span class="hub-desc">修改「关于」页的 Markdown 内容</span>
            </span>
            <span class="hub-go" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="hub-section">
      <h2 class="hub-label">站点</h2>
      <ul class="hub-list">
        <li>
          <a class="hub-row" href="/posts">
            <span class="hub-idx" aria-hidden="true">04</span>
            <span class="hub-text">
              <span class="hub-title">回到前台站点</span>
              <span class="hub-desc">以访客视角查看文章列表</span>
            </span>
            <span class="hub-go" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>

    <section class="hub-session">
      <div>
        <p class="hub-session-title">会话</p>
        <p class="hub-session-desc">退出后需重新登录才能继续管理内容。</p>
      </div>
      <form method="post" action="/admin/logout">
        <button class="btn btn-ghost btn-sm" type="submit">退出登录</button>
      </form>
    </section>
  </main>

  {{template "site-footer" .}}
</body>
</html>

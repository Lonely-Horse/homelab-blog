<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .IsNew}}新建项目{{else}}编辑项目{{end}} · LonelyHorse</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  {{template "admin-nav" .}}

  <main class="container">
    <p class="back-row"><a class="navlink" href="/admin/projects">← 返回项目后台</a></p>

    <header class="page-head">
      <h1>{{if .IsNew}}新建项目{{else}}编辑项目{{end}}</h1>
    </header>

    {{if .Error}}<p class="notice" role="alert">{{.Error}}</p>{{end}}

    <form class="panel panel-pad" method="post" action="{{.FormAction}}" enctype="multipart/form-data">
      <p>
        <label for="title">标题</label>
        <input id="title" name="title" type="text" value="{{.Project.Title}}" required>
      </p>
      <p>
        <label for="slug">Slug（URL 标识，如 homelab-blog）</label>
        <input id="slug" name="slug" type="text" value="{{.Project.Slug}}" required>
      </p>
      <p>
        <label for="summary">一句话简介</label>
        <textarea id="summary" name="summary" rows="3">{{.Project.Summary}}</textarea>
      </p>
      <p>
        <label for="github_url">GitHub 链接（可留空；填了须以 https://github.com/ 开头）</label>
        <input id="github_url" name="github_url" type="text" value="{{.Project.GithubURL}}">
      </p>
      <p>
        <label for="demo_url">Demo 链接（可留空）</label>
        <input id="demo_url" name="demo_url" type="text" value="{{.Project.DemoURL}}">
      </p>
      <p>
        <label for="archive">项目压缩包（.zip 格式，最大 60 MiB）</label>
        <input id="archive" name="archive" type="file" accept=".zip,application/zip">
        {{if .IsNew}}
          <span class="muted field-hint">可选。不上传则该项目暂时没有下载包。</span>
        {{else if .Project.ArchivePath}}
          <span class="muted field-hint">当前：{{.Project.ArchivePath}} · 不选新文件则保留原包</span>
        {{else}}
          <span class="muted field-hint">当前没有压缩包，选择一个 .zip 即可添加。</span>
        {{end}}
      </p>
      <p>
        <label for="tech_stack">技术栈（逗号分隔，如 Go,Docker,SQLite）</label>
        <input id="tech_stack" name="tech_stack" type="text" value="{{.Project.TechStack}}">
      </p>
      <p>
        <label for="status">状态</label>
        <select id="status" name="status">
          <option value="active" {{if eq .Project.Status "active"}}selected{{end}}>active（正常展示）</option>
          <option value="archived" {{if eq .Project.Status "archived"}}selected{{end}}>archived（归档 · 置底）</option>
        </select>
      </p>
      <p>
        <label for="sort_order">排序权重（数字，越小越靠前，可留空）</label>
        <input id="sort_order" name="sort_order" type="text" inputmode="numeric" value="{{.Project.SortOrder}}">
      </p>
      <p class="checkbox-row">
        <label for="featured"><input id="featured" name="featured" type="checkbox" {{if .Project.Featured}}checked{{end}}> 置顶（★）</label>
      </p>
      <p>
        <button class="btn" type="submit">保存</button>
      </p>
    </form>
  </main>

  {{template "site-footer" .}}
</body>
</html>

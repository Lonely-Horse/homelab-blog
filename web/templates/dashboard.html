<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LonelyHorse</title>
  <!-- 样式与脚本一律外链（CSP style-src/script-src 'self'，禁内联）
       app.js 放在 head 同步执行：主题需在首屏绘制前落到 <html data-theme>，否则暗->亮切换会闪 -->
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <!-- 幕布（B 模型）：/ 为纯幕布，零后端数据；点击 / 回车 / 上拉后跳 data-enter -->
  <div class="curtain" id="curtain" data-enter="/posts" role="button" tabindex="0" aria-label="点击或上拉进入文章">

    <!-- 顶部状态栏：像设备前面板的电源指示灯 -->
    <div class="curtain-status">
      <span class="status-dot" aria-hidden="true"></span>
      <span>HOMELAB · ONLINE</span>
      <span class="curtain-status-right">GO / SELF-HOSTED</span>
    </div>

    <!-- 四角取景框 -->
    <div class="curtain-frame" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>

    <div class="curtain-inner">
      <div class="curtain-mark">
        <span class="curtain-halo" aria-hidden="true"></span>
        <img class="curtain-logo" src="/static/logo-lg.png" alt="" width="128" height="128">
      </div>
      <h1 class="curtain-title">Lonely Horse</h1>
      <p class="curtain-tagline">Go · 云原生 · DevOps</p>
      <p class="curtain-hint">点击，或上拉进入</p>
    </div>

    <!-- 底部拉手：一根会轻微上浮的细线，只做“可以往上拉”的暗示 -->
    <span class="curtain-grip" aria-hidden="true"></span>
  </div>

  <noscript>
    <div class="center-page">
      <a class="btn" href="/posts">进入文章</a>
    </div>
  </noscript>
</body>
</html>

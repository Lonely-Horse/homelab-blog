<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .IsNew}}新建文章{{else}}编辑文章{{end}} · LonelyHorse</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
  <script src="/static/admin.js" defer></script>
</head>
<body>
  {{template "admin-nav" .}}

  <main class="container admin-editor-page">
    <p class="back-row"><a class="navlink" href="/admin/posts">← 返回文章后台</a></p>

    <header class="admin-head">
      <div>
        <p class="admin-eyebrow">Editor · Post</p>
        <h1>{{if .IsNew}}新建文章{{else}}编辑文章{{end}}</h1>
      </div>
      <div class="admin-head-side">
        {{if eq .Post.Status "published"}}<span class="badge is-live">已发布</span>{{else}}<span class="badge is-draft">草稿</span>{{end}}
      </div>
    </header>

    {{if .Error}}<p class="notice" role="alert">{{.Error}}</p>{{end}}

    <form id="post-form" class="editor" method="post" action="{{.FormAction}}" data-status="{{.Post.Status}}">
      <div class="editor-main panel">
        <div class="editor-strip">
          <span class="editor-strip-label">撰写</span>
          <span class="editor-meta" id="editor-count">0 字</span>
        </div>

        <div class="editor-main-body">
          <div class="field-row">
            <p class="field">
              <label for="title">标题</label>
              <input id="title" name="title" type="text" value="{{.Post.Title}}" placeholder="给这篇文章起个名字" required>
            </p>
            <p class="field">
              <label for="slug">Slug（URL 标识）</label>
              <input id="slug" name="slug" type="text" value="{{.Post.Slug}}" placeholder="hello-world" required>
            </p>
          </div>
          <p class="field field-summary">
            <label for="summary">摘要</label>
            <textarea id="summary" name="summary" rows="2" placeholder="一句话说明这篇写了什么，会显示在列表和文章页顶部">{{.Post.Summary}}</textarea>
          </p>
          <p class="field field-content">
            <label for="content_md">正文</label>
            <textarea id="content_md" name="content_md" rows="20" spellcheck="false" placeholder="支持 Markdown：## 标题、**加粗**、- 列表、> 引用、``` 代码块">{{.Post.ContentMD}}</textarea>
          </p>
        </div>
      </div>

      <aside class="editor-side panel" aria-label="实时预览">
        <div class="editor-strip">
          <span class="editor-strip-label">预览</span>
          <span class="editor-preview-status muted" id="preview-status" role="status"></span>
        </div>

        <div class="editor-preview-scroll">
          <article class="editor-preview-doc">
            <header class="article-head">
              <p class="article-eyebrow">
                <span class="article-kicker">Post</span>
                <span id="preview-slug" class="editor-preview-slug">/draft</span>
              </p>
              <h1 id="preview-title">未命名</h1>
              <p class="article-summary" id="preview-summary" hidden></p>
            </header>
            <div class="editor-preview-body prose" id="preview-body">
              <p class="editor-preview-empty">正文渲染结果会实时出现在这里。</p>
            </div>
          </article>
        </div>
      </aside>

      <div class="editor-actions">
        <span class="editor-dirty" id="editor-dirty" hidden><span class="editor-dirty-dot"></span>未保存</span>
        <span class="editor-actions-hint muted">Ctrl / ⌘ + S 保存</span>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="submit" name="status" value="draft">存草稿</button>
        <button class="btn" type="submit" name="status" value="published">{{if eq .Post.Status "published"}}更新{{else}}发布{{end}}</button>
      </div>
    </form>
  </main>

  {{template "site-footer" .}}
</body>
</html>

<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .IsNew}}新建文章{{else}}编辑文章{{end}} · LonelyHorse</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
  <script src="/static/admin.js" defer></script>
</head>
<body>
  {{template "admin-nav" .}}

  <main class="container admin-editor-page">
    <p class="back-row"><a class="navlink" href="/admin/posts">← 返回文章后台</a></p>

    <header class="page-head">
      <h1>{{if .IsNew}}新建文章{{else}}编辑文章{{end}}</h1>
    </header>

    {{if .Error}}<p class="notice" role="alert">{{.Error}}</p>{{end}}

    <form id="post-form" class="editor" method="post" action="{{.FormAction}}" data-status="{{.Post.Status}}">
      <div class="editor-main panel panel-pad">
        <div class="field-row">
          <p>
            <label for="title">标题</label>
            <input id="title" name="title" type="text" value="{{.Post.Title}}" required>
          </p>
          <p>
            <label for="slug">Slug（URL 标识）</label>
            <input id="slug" name="slug" type="text" value="{{.Post.Slug}}" placeholder="hello-world" required>
          </p>
        </div>
        <p>
          <label for="summary">摘要</label>
          <textarea id="summary" name="summary" rows="3">{{.Post.Summary}}</textarea>
        </p>
        <p>
          <label for="content_md">正文（Markdown）</label>
          <textarea id="content_md" name="content_md" rows="20" spellcheck="false">{{.Post.ContentMD}}</textarea>
        </p>
      </div>

      <aside class="editor-side panel" aria-label="实时预览">
        <div class="editor-side-head">
          <span>预览</span>
          <span class="editor-preview-status muted" id="preview-status" role="status"></span>
        </div>
        <div class="editor-preview-body prose" id="preview-body">
          <p class="muted">正文渲染结果将显示在这里。</p>
        </div>
      </aside>

      <div class="editor-actions">
        <span class="editor-actions-hint muted">Ctrl / ⌘ + S 保存</span>
        <span class="spacer"></span>
        <button class="btn btn-ghost" type="submit" name="status" value="draft">存草稿</button>
        <button class="btn" type="submit" name="status" value="published">发布</button>
      </div>
    </form>
  </main>

  {{template "site-footer" .}}
</body>
</html>

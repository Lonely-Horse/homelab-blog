<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · LonelyHorse</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  {{template "site-nav" .}}

  <main class="container">
    <p class="back-row"><a class="navlink" href="/posts">← 返回文章</a></p>

    <article class="article">
      <header class="article-head">
        <p class="article-eyebrow">
          <span class="article-kicker">Post</span>
          {{with .PublishedAt}}<time datetime="{{.Format "2006-01-02T15:04:05Z07:00"}}">{{.Local.Format "2006.01.02"}}</time>{{end}}
        </p>
        <h1>{{.Title}}</h1>
        {{if .Summary}}<p class="article-summary">{{.Summary}}</p>{{end}}
      </header>

      <div class="article-body prose">{{.ContentHTML}}</div>

      <footer class="article-foot">
        {{if not .UpdateAt.IsZero}}
        <span>最后更新 {{.UpdateAt.Local.Format "2006-01-02 15:04"}}</span>
        {{end}}
        <span class="spacer"></span>
        <a href="/posts">← 全部文章</a>
      </footer>
    </article>
  </main>

  {{template "site-footer" .}}
</body>
</html>

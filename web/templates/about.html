<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于 · LonelyHorse</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
  {{template "site-nav" .}}

  <main class="container">
    <header class="masthead">
      <div>
        <h1>关于本站</h1>
        <p class="masthead-sub">一台 VPS、几个容器，和一份还在生长的记录。</p>
      </div>
      <p class="masthead-meta">SELF-HOSTED</p>
    </header>

    <div class="about-grid">
      <section class="about-body">
        <div class="prose">
          {{if .ContentHTML}}
          {{.ContentHTML}}
          {{else}}
          <p class="muted">站主还没有填写简介。</p>
          {{end}}
        </div>
      </section>

      <aside class="about-side" aria-label="站点概况">
        <dl class="about-facts">
          <div class="about-fact">
            <dt>Posts</dt>
            <dd>{{.Posts}}<span>篇</span></dd>
          </div>
          <div class="about-fact">
            <dt>Projects</dt>
            <dd>{{.Projects}}<span>个</span></dd>
          </div>
        </dl>
        {{if not .UpdatedAt.IsZero}}
        <p class="about-updated">最后更新<br>{{.UpdatedAt.Local.Format "2006-01-02 15:04"}}</p>
        {{end}}
      </aside>
    </div>
  </main>

  {{template "site-footer" .}}
</body>
</html>
